name: FluxWAN CI & Automated Release Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Automated Testing & Verification
  # ============================================================================
  build-and-test:
    name: Build & Test (Ubuntu 22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            gcc-multilib \
            clang \
            llvm \
            libbpf-dev \
            linux-libc-dev \
            python3 \
            cmake

      - name: Compile FluxWAN Core, BPF & Lab Simulator
        run: |
          make clean
          make all

      - name: Run Automated Test Suites
        run: |
          make test

      - name: Test CMake Build Equivalence
        run: |
          mkdir -p build && cd build
          cmake ..
          make
          ctest --output-on-failure

  # ============================================================================
  # 2. Build x86_64 Release Packages (Full Bootable ISO + Standalone Service)
  # ============================================================================
  build-x86_64:
    name: Build x86_64 ISO & Appliance Package
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build & ISO Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            clang \
            llvm \
            libbpf-dev \
            linux-libc-dev \
            python3 \
            zip \
            tar \
            xorriso \
            squashfs-tools \
            curl

      - name: Build Full Hybrid Bootable ISO (UEFI + BIOS)
        run: |
          echo "[+] Building full bootable x86_64 ISO image..."
          mkdir -p dist
          curl -fSL -o dist/alpine-standard-base.iso https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/alpine-standard-3.19.1-x86_64.iso
          bash scripts/build_iso_embedded.sh
          cp -f dist/fluxwan-os-x86_64.iso FluxWAN-OS-x86_64-Bootable.iso

      - name: Build Standalone x86_64 Appliance Package
        run: |
          echo "[+] Packaging standalone x86_64 daemon & service..."
          mkdir -p dist_pkg/fluxwan-x86_64/bin
          mkdir -p dist_pkg/fluxwan-x86_64/bpf
          mkdir -p dist_pkg/fluxwan-x86_64/config
          mkdir -p dist_pkg/fluxwan-x86_64/systemd

          cp -f fluxwan dist_pkg/fluxwan-x86_64/bin/
          cp -f fluxwan_lab dist_pkg/fluxwan-x86_64/bin/
          cp -f bpf/*.bpf.o dist_pkg/fluxwan-x86_64/bpf/ 2>/dev/null || true
          cp -f config/fluxwan.json dist_pkg/fluxwan-x86_64/config/
          cp -f systemd/fluxwan.service dist_pkg/fluxwan-x86_64/systemd/
          cp -f install.sh dist_pkg/fluxwan-x86_64/
          cp -f README.md dist_pkg/fluxwan-x86_64/
          chmod +x dist_pkg/fluxwan-x86_64/install.sh dist_pkg/fluxwan-x86_64/bin/*

          cd dist_pkg
          zip -r ../FluxWAN-x86_64-Appliance.zip fluxwan-x86_64
          tar -czvf ../FluxWAN-x86_64-Appliance.tar.gz fluxwan-x86_64
          cd ..

      - name: Upload x86_64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: |
            FluxWAN-OS-x86_64-Bootable.iso
            FluxWAN-x86_64-Appliance.zip
            FluxWAN-x86_64-Appliance.tar.gz

  # ============================================================================
  # 3. Build MikroTik RB5009 (ARM64) Release Packages
  # ============================================================================
  build-arm64:
    name: Build MikroTik RB5009 (ARM64) Package
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install ARM64 Cross-Compiler & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross \
            clang \
            llvm \
            libbpf-dev \
            linux-libc-dev \
            python3 \
            zip \
            tar

      - name: Build & Package MikroTik RB5009 (ARM64)
        run: |
          echo "[+] Cross-compiling ARM64 binaries for MikroTik RB5009..."
          make clean
          make CC=aarch64-linux-gnu-gcc TARGET=fluxwan LAB_TARGET=fluxwan_lab all
          aarch64-linux-gnu-strip fluxwan fluxwan_lab

          mkdir -p dist_pkg/fluxwan-mikrotik-rb5009/bin
          mkdir -p dist_pkg/fluxwan-mikrotik-rb5009/bpf
          mkdir -p dist_pkg/fluxwan-mikrotik-rb5009/config

          cp -f fluxwan dist_pkg/fluxwan-mikrotik-rb5009/bin/
          cp -f fluxwan_lab dist_pkg/fluxwan-mikrotik-rb5009/bin/
          cp -f bpf/*.bpf.o dist_pkg/fluxwan-mikrotik-rb5009/bpf/ 2>/dev/null || true
          cp -f config/fluxwan.json dist_pkg/fluxwan-mikrotik-rb5009/config/

          if [ -d dist/rb5009 ]; then
            cp -rf dist/rb5009/* dist_pkg/fluxwan-mikrotik-rb5009/ 2>/dev/null || true
          fi
          cp -f README.md dist_pkg/fluxwan-mikrotik-rb5009/

          cd dist_pkg
          zip -r ../FluxWAN-MikroTik-RB5009-ARM64.zip fluxwan-mikrotik-rb5009
          tar -czvf ../FluxWAN-MikroTik-RB5009-ARM64.tar.gz fluxwan-mikrotik-rb5009
          cd ..

      - name: Upload ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64
          path: |
            FluxWAN-MikroTik-RB5009-ARM64.zip
            FluxWAN-MikroTik-RB5009-ARM64.tar.gz

  # ============================================================================
  # 4. Publish Release to GitHub Releases
  # ============================================================================
  publish-release:
    name: Publish Release to GitHub
    needs: [build-x86_64, build-arm64]
    runs-on: ubuntu-22.04

    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Generate Checksums (SHA256)
        run: |
          cd release_files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Set Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=latest" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: FluxWAN Production Release (${{ steps.vars.outputs.TAG_NAME }})
          prerelease: ${{ steps.vars.outputs.IS_PRERELEASE == 'true' }}
          draft: false
          files: |
            release_files/FluxWAN-OS-x86_64-Bootable.iso
            release_files/FluxWAN-MikroTik-RB5009-ARM64.zip
            release_files/FluxWAN-MikroTik-RB5009-ARM64.tar.gz
            release_files/FluxWAN-x86_64-Appliance.zip
            release_files/FluxWAN-x86_64-Appliance.tar.gz
            release_files/SHA256SUMS.txt
          body: |
            ## 🚀 FluxWAN Carrier-Grade Multi-WAN Aggregator & Load Balancer

            ### 📦 حزم ونظام التشغيل الكامل الجاهز للتحميل والتنصيب المباشر (Ready-to-Deploy):

            #### 1️⃣ صورة نظام التشغيل الكاملة لأجهزة وسيرفرات x86_64 (Bare-Metal & Virtual Appliance):
            - **`FluxWAN-OS-x86_64-Bootable.iso` (~86 MB)**:
              - صورة ISO ذاتية الإقلاع (Hybrid UEFI + BIOS) جاهزة للحرق المباشر على فلاشة USB باستخدام Rufus أو BalenaEtcher أو Ventoy.
              - تتضمن نواة Linux LTS مع كامل تعريفات كروت الشبكة (Intel, Realtek, Mellanox 10G/25G/40G, VirtIO).
              - تقلع وتثبت النظام تلقائياً على القرص الصلب أو الـ NVMe بضغطة زر.
            - **`FluxWAN-x86_64-Appliance.zip`**: حزمة المحرك والخدمة المستقلة مع سكريبت التثبيت `install.sh`.

            #### 2️⃣ حزمة راوترات مايكروتك MikroTik RB5009 (معمارية ARM64):
            - **`FluxWAN-MikroTik-RB5009-ARM64.zip`**:
              - أداة الفلاش السريع لويندوز `FluxWAN-Windows-Flasher.bat` (فلاش بنقرة واحدة عبر TFTP/Netinstall).
              - الثنائيات المترجمة لمعمارية ARM64 (`bin/fluxwan`, `bin/fluxwan_lab`).
              - كائنات النواة `eBPF XDP` المسرعة لتوجيه الرزم بسرعة السلك.
              - الدعم الكامل لجلسات Starlink IPv6 والـ PPPoE المتعدد.

            ---

            ### 🔐 التحقق من سلامة الملفات (Checksums):
            تجدون بصمات `SHA-256` لجميع الملفات داخل المرفق `SHA256SUMS.txt`.