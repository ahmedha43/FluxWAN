version: '3.8'

services:
  fluxwan:
    build: .
    container_name: fluxwan-router
    network_mode: host
    privileged: true
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - BPF
    volumes:
      - ./config:/opt/fluxwan/config
    environment:
      - TZ=UTC
