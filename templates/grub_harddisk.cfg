# ==============================================================================
# FluxWAN Embedded Network Appliance - Hard Disk GRUB Configuration Template
# Target: /boot/grub/grub.cfg or /boot/efi/EFI/BOOT/grub.cfg
# ==============================================================================
set default=0
set timeout=3
set timeout_style=menu

# Color Theme
set menu_color_normal=white/black
set menu_color_highlight=cyan/black

menuentry "FluxWAN Multi-WAN Router Appliance (Standard Boot)" --class os {
    insmod ext2
    insmod gzio
    insmod part_gpt
    insmod part_msdos
    linux /boot/vmlinuz-lts root=@@ROOT_SPEC@@ rootfstype=ext4 rw quiet loglevel=3 console=tty0 console=ttyS0,115200
    initrd /boot/initramfs-lts
}

menuentry "FluxWAN Multi-WAN Router Appliance (Safe Mode / Verbose)" --class os {
    insmod ext2
    insmod gzio
    insmod part_gpt
    insmod part_msdos
    linux /boot/vmlinuz-lts root=@@ROOT_SPEC@@ rootfstype=ext4 rw debug verbose console=tty0 console=ttyS0,115200
    initrd /boot/initramfs-lts
}

menuentry "FluxWAN Recovery Shell (Single User Mode)" --class os {
    insmod ext2
    insmod gzio
    insmod part_gpt
    insmod part_msdos
    linux /boot/vmlinuz-lts root=@@ROOT_SPEC@@ rootfstype=ext4 rw single init=/bin/sh console=tty0 console=ttyS0,115200
    initrd /boot/initramfs-lts
}